# =====================================================
# ENTORNO DE PRODUCCION (ejemplo)
# =====================================================

# H2 en modo archivo: los datos PERSISTEN en disco (en un entorno real seria PostgreSQL/MySQL)
spring.datasource.url=jdbc:h2:file:./data/tododb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}

# En produccion NO se tocan las tablas automaticamente:
# si el esquema no coincide, la app falla (mas seguro que corromper datos)
spring.jpa.hibernate.ddl-auto=validate

# Consola de H2 DESACTIVADA en produccion (riesgo de seguridad)
spring.h2.console.enabled=false

# No mostrar SQL de produccion
spring.jpa.show-sql=false