# =====================================================
# ENTORNO DE DESARROLLO (local)
# =====================================================

# H2 en memoria: borra todo al reiniciar la app
spring.datasource.url=jdbc:h2:mem:tododb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y actualiza las tablas automaticamente (facil para desarrollarse)
spring.jpa.hibernate.ddl-auto=update

# Consola web de H2 disponible en /h2-console (solo desarrollo)
spring.h2.console.enabled=true

# Mostrar las consultas SQL en consola
spring.jpa.show-sql=true